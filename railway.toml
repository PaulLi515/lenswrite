# Railway monorepo config (used when Root Directory is the repo root).
# Prefer: Service Settings → Root Directory = lenswrite-backend
# Then lenswrite-backend/railway.toml + Dockerfile apply instead.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
